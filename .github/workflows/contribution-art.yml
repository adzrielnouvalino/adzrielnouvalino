
name: Generate GitHub Contribution Art

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Tetris Animation
        uses: leereilly/contribution-graph-art@v1
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          output_path: dist/contribution-graph-tetris.svg
          tetromino_count: "5"
          palette: "auto"
          animation_duration: "8"

      - name: Generate Snake Animation
        uses: leereilly/contribution-graph-art@v1
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          output_path: dist/contribution-graph-snake.svg
          animation_mode: "snake"
          food_count: "5"
          palette: "auto"


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Start local server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 &
          sleep 2

      - name: Convert SVG to GIF
        run: node scripts/render-svg-gifs.mjs


      - name: Enable infinite animation loop
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          for file in Path("dist").glob("*.svg"):
              content = file.read_text()

              def enable_loop(match):
                  tag = match.group(0)

                  if "repeatCount=" in tag:
                      return tag

                  return tag[:-1] + ' repeatCount="indefinite">'

              content = re.sub(
                  r'<animate(?:Transform|Motion)?\b[^>]*>',
                  enable_loop,
                  content
              )

              file.write_text(content)
              print(f"Loop enabled: {file}")
          PY

      - name: Publish animations
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
